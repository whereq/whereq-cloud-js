name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Pinned: `ubuntu-latest` is a moving target and has already migrated to Ubuntu 26.
    # Pinning keeps the toolchain identical until we deliberately bump it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
